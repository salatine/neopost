title: "cat blog!!"
baseURL: "https://neopost.neocities.org"
locale: "en-us"
titleCaseStyle: "none"
theme: "neopost"

params:
  theme: "light-blue"
  favicon: "/favicon.ico"
  # posts-per-page: 1
  toc-auto-numbering: false
  dateformat: '01/02/2006 15:04'
  sidebar:
    tags:
      enable: true
      limit: 2
      more-text: "more tags..."
  read-more:
    length-limit: 120
    text:
      more: "read more"
      less: "read less"
